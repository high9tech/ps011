<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIGH TECH PS - Jailbreak Host</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#d4af37">
  <!-- ربط ملف التنسيق الخارجي style.css -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- حاوية الصورة الخلفية التي تغطي الشاشة بالكامل -->
  <div class="full-bg">
    <img src="./background.png" alt="HIGH TECH PS" onerror="this.style.display='none';">
  </div>

  <!-- الطبقة المظلمة فوق الصورة لضمان وضوح الأزرار -->
  <div class="overlay"></div>

  <!-- لوحة التحكم المركزية -->
  <div class="main-card">
    <div class="brand-title">HIGH TECH PS</div>
    <div class="brand-subtitle">PlayStation Maintenance & All-in-One Exploit</div>

    <!-- شريط حالة الكاش (Offline Status) -->
    <div class="cache-status">
      <span>حالة التخزين الأوفلاين:</span>
      <div>
        <span id="cache-status-text">جاري التحقق...</span>
        <span class="status-dot" id="cache-dot"></span>
      </div>
    </div>

    <!-- زر التعديل الموحد لجميع الأجهزة والثغرات -->
    <div class="action-wrapper">
      <button class="btn-gold-trigger" id="masterBtn" onclick="runMasterExploit()">
        <span class="btn-text">تفعيل التعديلة الموحدة</span>
        <span class="btn-subtext">PS4 / PS5 • WebKit • GoldHEN • PSFree</span>
      </button>
    </div>

    <!-- شاشة الملاحظات والسجل (Console) -->
    <div class="console-box" id="consoleBox">
      <div class="console-line"><span class="prefix">[SYSTEM]</span> النظام جاهز لمسح الثغرات...</div>
      <div class="console-line"><span class="prefix">[INFO]</span> اضغط على الزر الذهبي لبدء التعديل الموحد.</div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // تسجيل sw.js بدون ./
        navigator.serviceWorker.register('sw.js')
          .then((reg) => {
            document.getElementById('cache-status-text').innerText = 'جاهز (Offline Ready)';
            document.getElementById('cache-dot').classList.add('active');
            if (typeof appendConsole === 'function') {
              appendConsole('تم حفظ الكاش بنجاح! جاهز للعمل بدون إنترنت.');
            }
          })
          .catch((err) => {
            console.error(err);
            document.getElementById('cache-status-text').innerText = 'خطأ في الكاش!';
            if (typeof appendConsole === 'function') {
              appendConsole('فشل تسجيل الكاش: ' + err.message);
            }
          });
      });
    }
  </script>
